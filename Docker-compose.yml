services:

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: requisicoes_materiais
      MYSQL_USER: william
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: .

    ports:
      - "3000:3000"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/requisicoes_materiais
      SPRING_DATASOURCE_USERNAME: william
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: